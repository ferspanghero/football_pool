name = "football-pool"
main = "api/index.ts"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

# The built SPA (dist/) ships with the Worker as static assets — one deploy, one origin.
# `run_worker_first` sends /api/* to the Hono Worker; every other path serves a static file,
# falling back to index.html so client-side routes (/admin, /game/:id) resolve in the SPA.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# database_id is filled in at deploy time via `wrangler d1 create football-pool`.
# Local dev (`wrangler dev`) uses the local emulated D1 keyed by database_name.
[[d1_databases]]
binding = "DB"
database_name = "football-pool"
database_id = "004c35e8-7a12-48ea-bb04-d325dff66ec5"
migrations_dir = "migrations"
