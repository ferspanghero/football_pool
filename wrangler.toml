name = "football-pool"
main = "api/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# database_id is filled in at deploy time via `wrangler d1 create football-pool`.
# Local dev (`wrangler dev`) uses the local emulated D1 keyed by database_name.
[[d1_databases]]
binding = "DB"
database_name = "football-pool"
database_id = "PLACEHOLDER_SET_AT_DEPLOY"
migrations_dir = "migrations"
