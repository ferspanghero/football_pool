<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIFA 2026 Pool</title>
    <script>
        // Apply the saved theme before paint so there's no flash of the default theme.
        try {
            if (localStorage.getItem('fp-theme') === 'elifoot') document.documentElement.dataset.theme = 'elifoot';
        } catch {
            /* storage unavailable — fall back to the default theme */
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
